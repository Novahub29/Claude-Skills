<style>
/* Layout: ASR brand cabinet, same as Deep Dive. HUD strip, crew radio, square-grid worksite, touch pad on phones. Deliberately dark only. */
:root{
  --abyss:#050709;
  --deep:#0e1317;
  --rock:#1b2227;
  --edge:#8f9ba3;
  --rov:#ffc629;
  --coral:#f3f5f6;
  --text:#eef1f3;
  --muted:#88939a;
  --frame:#1d2327;
  --lamp:#fff6cf;
  --sonar:#cfeeff;
  --j1:#ff5d8f;
  --j2:#c77dff;
  --j3:#3ee6a0;
  --j4:#ff9f1c;
  --display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--text);font-family:var(--body);overflow:hidden;
  background-image:radial-gradient(ellipse at 50% -20%,var(--rock),var(--abyss) 65%)}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud{width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.stats{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:4px}
.label{font-family:var(--display);font-weight:400;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.val{font-family:var(--display);font-weight:600;font-size:17px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.val.gold{color:var(--rov)}
.lives{display:flex;gap:5px;height:17px;align-items:center}
.life{width:16px;height:11px;border-radius:2px;background:var(--rov);box-shadow:inset 0 -5px 0 var(--frame)}
.tools{display:flex;gap:6px}
.btn-sm{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text);background:transparent;border:1px solid var(--rock);border-radius:3px;padding:8px 10px;cursor:pointer}
.btn-sm:hover{border-color:var(--edge)}
button:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.stage{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage:has(.overlay:not([hidden])){touch-action:pan-y}
.screen{position:relative}
canvas{display:block;border-radius:4px;box-shadow:0 0 0 1px var(--rock),0 24px 60px -24px #000}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
.panel{max-width:360px;width:100%;max-height:100%;overflow-y:auto;box-sizing:border-box;background:color-mix(in srgb,var(--abyss) 92%,transparent);border:1px solid var(--rock);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:center;backdrop-filter:blur(3px)}
.banner{display:block;width:100%;aspect-ratio:1672/941;max-width:100%;object-fit:cover;border-radius:3px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.32em;color:var(--text);text-transform:uppercase}
.eyebrow.newbest{color:var(--rov)}
.panel h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(20px,5.5vw,26px);line-height:1.1;letter-spacing:.24em;text-transform:uppercase;color:var(--text);text-wrap:balance}
.panel p{margin:0;font-size:13px;line-height:1.5;color:var(--text)}
.panel .small{font-size:11px;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--abyss);background:var(--text);border:0;border-radius:3px;padding:14px 16px;cursor:pointer;box-shadow:0 4px 0 var(--edge)}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 var(--edge)}
.result{display:flex;justify-content:center;gap:22px}
.actions{display:flex;gap:8px}
.actions .btn-sm{flex:1;padding:11px 10px}
.cta{display:block;font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--rov);text-decoration:none;border:1px solid var(--rov);border-radius:3px;padding:11px 10px}
.cta:hover{background:color-mix(in srgb,var(--rov) 12%,transparent)}
.radio{width:100%;max-width:600px;box-sizing:border-box;min-height:38px;display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--rock);border-radius:6px;background:var(--deep);opacity:.55;transition:opacity .2s}
.radio.live{opacity:1;border-color:var(--edge)}
.radio .led{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.radio.live .led{background:var(--j3);box-shadow:0 0 8px var(--j3)}
.radio .who{font-family:var(--display);font-weight:700;font-size:9px;letter-spacing:.2em;color:var(--rov);flex:none;text-transform:uppercase}
.radio .msg{font-size:13px;line-height:1.3;min-width:0}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:transparent;border:1px solid var(--rock);border-radius:6px;color:var(--text);cursor:pointer;font-family:var(--body)}
.pick[aria-checked="true"]{border-color:var(--text);background:var(--deep);box-shadow:0 0 0 1px var(--text)}
.pick canvas{width:64px;height:44px;box-shadow:none;border-radius:0}
.pname{font-family:var(--display);font-weight:600;font-size:9px;letter-spacing:.14em;text-transform:uppercase;line-height:1.3}
.pperk{font-size:11px;line-height:1.3;color:var(--muted)}
.pad{display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,46px);gap:4px;grid-template-areas:". u ." "l . r" ". d .";touch-action:none}
.pad button{font-size:18px;color:var(--text);background:var(--deep);border:1px solid var(--rock);border-radius:8px;cursor:pointer}
.pad button:active{background:var(--rock)}
.hint{font-family:var(--display);font-size:9px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase;text-align:center}
@media (pointer:coarse){.pad{display:grid}.hint{display:none}}
@media (prefers-reduced-motion:reduce){.big:active{transform:none}}
</style>
</head><body>


<div class="app">
  <div class="hud">
    <div class="stats">
      <div class="stat"><span class="label">Score</span><span class="val" id="score">0</span></div>
      <div class="stat"><span class="label">Best</span><span class="val gold" id="best">0</span></div>
      <div class="stat"><span class="label">Depth</span><span class="val" id="depth">250 m</span></div>
      <div class="stat"><span class="label">Tether</span><span class="val" id="tether">15 m</span></div>
      <div class="stat"><span class="label">Lives</span><span class="lives" id="lives"></span></div>
    </div>
    <div class="tools">
      <button class="btn-sm" id="muteBtn" type="button">Sound on</button>
      <button class="btn-sm" id="pauseBtn" type="button">Pause</button>
    </div>
  </div>

  <div class="radio" id="radio" aria-live="polite">
    <span class="led"></span>
    <span class="who" id="radioWho">Ch 16</span>
    <span class="msg" id="radioMsg">Radio check. Loud and clear.</span>
  </div>

  <div class="stage" id="stage">
    <div class="screen" id="screen">
      <canvas id="game" aria-label="Tether Tangle game board"></canvas>
    </div>
    <div class="overlay" id="overlay">
      <div class="panel" id="panel"></div>
    </div>
  </div>

  <div class="pad" id="pad">
    <button type="button" data-dir="up" style="grid-area:u" aria-label="Up">▲</button>
    <button type="button" data-dir="left" style="grid-area:l" aria-label="Left">◀</button>
    <button type="button" data-dir="right" style="grid-area:r" aria-label="Right">▶</button>
    <button type="button" data-dir="down" style="grid-area:d" aria-label="Down">▼</button>
  </div>
  <div class="hint">Arrow keys or WASD to steer · P to pause</div>
</div>

    const count = level < 2 ? 0 : level < 4 ? 1 : level < 6 ? 2 : 3;
    jellies = [];
    for (let i = 0; i < count; i++) {
      const c = freeCell(8);
      if (c) jellies.push({ i, x: c.x, y: c.y, px: c.x, py: c.y, dir: "left", t: Math.random() * 0.3 });
    }
    if (octo && onTether(octo.x, octo.y)) octo = null;
    if (!octo && got < GOAL) octo = freeCell(4);
    radioNext = 2.5; bubbles = [];
  }

  /* ---------- movement ---------- */
  const interval = () => Math.max(0.07, 0.15 - (level - 1) * 0.01 - got * 0.0015) * (vehicle === "diver" ? 1.15 : 1);
  const jellyInterval = () => Math.max(0.3, 0.5 - (level - 1) * 0.02);

  function tick() {
    if (queue.length) { const d = queue.shift(); if (d !== OPP[dir]) dir = d; }
    const h = segs[0];
    const [dx, dy] = DIRS[dir];
    const nx = h.x + dx, ny = h.y + dy;
    const growing = grow > 0;
    const hitSelf = segs.some((s, i) => s.x === nx && s.y === ny && (growing || i < segs.length - 1));
    if (wall(nx, ny) || hitSelf) {
      if (player.shield) {
        player.shield = false; graceT = 0.9;
        prev = segs.map(s => ({ ...s }));
        popups.push({ x: (h.x + 0.5) * T, y: (h.y + 0.5) * T, text: "SHIELD", age: 0 });
        sfxBump(); buzz(80); sayEvent("shield");
        return;
      }
      crash("tangle"); return;
    }
    prev = segs.map(s => ({ ...s }));
    segs.unshift({ x: nx, y: ny });
    if (growing) grow--; else segs.pop();
    player.dir = dir; player.face = dir;
    if (dir === "left" || dir === "right") player.hface = dir;

    if (octo && octo.x === nx && octo.y === ny) {
      const pts = 50 * level;
      score += pts; got++; grow += 2;
      popups.push({ x: (nx + 0.5) * T, y: (ny + 0.5) * T, text: `+${pts}`, age: 0 });
      blip();
      octo = got < GOAL ? freeCell(4) : null;
      if (got % 4 === 0 && got < GOAL) {
        const k = Math.min(level - 1, BONUSES.length - 1), c = freeCell(5);
        if (c) { bonus = { ...c, t: 8, kind: k, name: BONUSES[k].name, pts: BONUSES[k].pts }; say("DECK", pick(EVENTS.bonusDrop), true); }
      }
      if (level >= 2 && got === 7) { const c = freeCell(5); if (c) { winch = { ...c, t: 10 }; say("TMS", pick(EVENTS.winchDrop), true); } }
      if (got >= GOAL) { siteClear(); return; }
    }
    if (bonus && bonus.x === nx && bonus.y === ny) {
      const bp = bonus.pts * (vehicle === "auv" ? 2 : 1);
      score += bp;
      popups.push({ x: (nx + 0.5) * T, y: (ny + 0.5) * T, text: `${bonus.name} +${bp}`, age: 0 });
      sfxBonus(); buzz(30); sayEvent("bonusGet"); bonus = null;
    }
    if (winch && winch.x === nx && winch.y === ny) {
      const r = Math.min(5, segs.length - 3);
      if (r > 0) { segs.splice(segs.length - r); prev.splice(segs.length); }
      score += 100;
      popups.push({ x: (nx + 0.5) * T, y: (ny + 0.5) * T, text: "REEL IN", age: 0 });
      sfxWinch(); buzz(30); sayEvent("winchGet"); winch = null;
    }
    if (!longSaid && segs.length >= 16) { longSaid = true; sayEvent("long"); }
    if (!reduceMotion) {
      bubbleT--;
      if (bubbleT <= 0) { bubbleT = 2; bubbles.push({ x: (h.x + 0.5) * T, y: (h.y + 0.5) * T, age: 0, ph: Math.random() * 6, r: T * (0.05 + Math.random() * 0.05) }); }
    }
  }

  function jellyStep(j) {
    j.px = j.x; j.py = j.y;
    const opts = Object.keys(DIRS).filter(d => { const [dx, dy] = DIRS[d]; return !wall(j.x + dx, j.y + dy); });
    if (!opts.length) return;
    let d = j.dir;
    const [dx, dy] = DIRS[d];
    if (wall(j.x + dx, j.y + dy) || Math.random() < 0.22) {
      const fwd = opts.filter(o => o !== OPP[j.dir]);
      const list = fwd.length ? fwd : opts;
      // drift loosely towards the ROV a third of the time
      const h = segs[0];
      if (Math.random() < 0.35) list.sort((a, b) => dist2(j, a, h) - dist2(j, b, h));
      else list.sort(() => Math.random() - 0.5);
      d = list[0];
    }
    j.dir = d;
    j.x += DIRS[d][0]; j.y += DIRS[d][1];
  }
  const dist2 = (j, d, h) => (j.x + DIRS[d][0] - h.x) ** 2 + (j.y + DIRS[d][1] - h.y) ** 2;

  function crash(kind) {
    mode = "dying"; modeT = 0; bonus = null; winch = null;
    sfxDeath(); buzz([120, 60, 220]); sayEvent(kind);
  }
  function siteClear() {
    const sb = 250 * level;

    mode = "clear"; modeT = 0; sfxClear(); sayEvent("clear");
  }

  /* ---------- loop ---------- */
  const lerp = (a, b, k) => a + (b - a) * k;
  function headPos() {
    const k = (dir && graceT <= 0 && mode === "play") ? Math.min(1, acc / interval()) : 1;
    return [lerp(prev[0].x, segs[0].x, k), lerp(prev[0].y, segs[0].y, k), k];
  }
  function jellyPos(j) {
    const k = mode === "play" && dir ? Math.min(1, j.t / jellyInterval()) : 1;
    return [lerp(j.px, j.x, k), lerp(j.py, j.y, k)];
  }

  function update(dt) {
    const t = performance.now() / 1000;
    for (const s of snow) { s.y += s.v * dt; s.x += Math.sin(t * 0.6 + s.ph) * 4 * dt; if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; } }
    for (const b of bubbles) { b.age += dt; b.y -= 22 * dt; b.x += Math.sin(b.age * 8 + b.ph) * 6 * dt; }
    bubbles = bubbles.filter(b => b.age < 0.9);
    for (const p of popups) p.age += dt;
    popups = popups.filter(p => p.age < 1.2);
    if (radioShowT > 0) { radioShowT -= dt; if (radioShowT <= 0) radioEl.classList.remove("live"); }
    if (closeCd > 0) closeCd -= dt;
    if (mode === "play" && dir) { radioNext -= dt; if (radioNext <= 0) { radioNext = 3.5 + Math.random() * 3; if (radioShowT <= 0.4) sayAmbient(); } }

    if (mode === "play" && dir) {
      if (graceT > 0) { graceT -= dt; if (graceT > 0) return; acc = interval(); }
      acc += dt;
      let guard = 0;
      while (acc >= interval() && mode === "play" && graceT <= 0 && guard++ < 3) { acc -= interval(); tick(); }
      if (mode !== "play") return;
      if (bonus) { bonus.t -= dt; if (bonus.t <= 0) bonus = null; }
      if (winch) { winch.t -= dt; if (winch.t <= 0) winch = null; }
      for (const j of jellies) { j.t += dt; if (j.t >= jellyInterval()) { j.t -= jellyInterval(); jellyStep(j); } }
      if (!extraGiven && score >= 10000) {
        extraGiven = true; lives++;
        popups.push({ x: W / 2, y: 11.5 * T, text: "EXTRA LIFE", age: 0 });
        sfxExtra(); say("OFFICE", "Spare kit mobilised. Extra life!", true);
      }
      const [hx, hy] = headPos();
      for (const j of jellies) {
        const [jx, jy] = jellyPos(j);
        const d = Math.hypot(jx - hx, jy - hy);
        if (d < 0.6) {
          if (player.shield) {
            player.shield = false;
            const c = freeCell(8); if (c) { j.x = j.px = c.x; j.y = j.py = c.y; }
            popups.push({ x: (hx + 0.5) * T, y: (hy + 0.5) * T, text: "SHIELD", age: 0 });
            sfxBump(); buzz(80); say(sup(), "Took a sting. Still operational.", true);
          } else { crash("sting"); return; }
        } else if (d < 2.2 && closeCd <= 0) { closeCd = 7; sayEvent("close", false); }
      }
    }
    else if (mode === "dying") {
      modeT += dt;
      if (modeT > 1.5) {
        lives--;
        if (lives <= 0) gameOver();
        else { launch(); mode = "play"; say(sup(), "New vehicle in the water. Steer when ready.", true); }
      }
    }
    else if (mode === "clear") {
      modeT += dt;
      if (modeT > 2.4) { level++; buildSite(); octo = null; launch(); buildWalls(); mode = "play"; sfxStart(); sayEvent("start"); }
    }
  }

  /* ---------- drawing ---------- */
  function buildWalls() {
    wallLayer = document.createElement("canvas");
    wallLayer.width = W * dpr; wallLayer.height = H * dpr;
    const g = wallLayer.getContext("2d");
    g.scale(dpr, dpr);
    let seed = 7 + level; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (grid[y][x] !== "#") continue;
      g.fillStyle = COL.rock; g.fillRect(x * T, y * T, T, T);
      g.fillStyle = COL.deep;
      for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(x * T + rnd() * T, y * T + rnd() * T, T * (0.04 + rnd() * 0.06), 0, Math.PI * 2); g.fill(); }
    }
    const lw = Math.max(1.5, T * 0.1);
    g.strokeStyle = COL.edge; g.lineWidth = lw; g.lineCap = "round";
    const isW = (x, y) => (y < 0 || y >= ROWS || x < 0 || x >= COLS) ? true : grid[y][x] === "#";
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (grid[y][x] !== "#") continue;
      const x0 = x * T, y0 = y * T, h = lw / 2;
      g.beginPath();
      if (!isW(x, y - 1)) { g.moveTo(x0, y0 + h); g.lineTo(x0 + T, y0 + h); }
      if (!isW(x, y + 1)) { g.moveTo(x0, y0 + T - h); g.lineTo(x0 + T, y0 + T - h); }
      if (!isW(x - 1, y)) { g.moveTo(x0 + h, y0); g.lineTo(x0 + h, y0 + T); }
      if (!isW(x + 1, y)) { g.moveTo(x0 + T - h, y0); g.lineTo(x0 + T - h, y0 + T); }
      g.stroke();
    }
    // TMS cage at the launch point
    g.strokeStyle = COL.edge; g.lineWidth = Math.max(1, T * 0.06);
    g.strokeRect(8.5 * T, 1.15 * T, 2 * T, 1.5 * T);
    g.beginPath(); g.moveTo(9.5 * T, 0.2 * T); g.lineTo(9.5 * T, 1.15 * T); g.stroke();
  }

  // ASR skull octopus: skull head, camera-aperture eyes, curling tentacles, manipulator arms.
  function drawOcto(g, cx, cy, r, color) {
    g.save();
    g.fillStyle = color; g.strokeStyle = color; g.lineCap = "round"; g.lineJoin = "round";
    g.lineWidth = r * 0.07;
    g.beginPath(); g.arc(cx, cy, r * 1.08, 0, Math.PI * 2); g.stroke();
    g.lineWidth = r * 0.12;
    [-1, 1].forEach(s => {
      g.beginPath(); g.moveTo(cx + s * r * 0.3, cy - r * 0.05); g.quadraticCurveTo(cx + s * r * 0.75, cy - r * 0.05, cx + s * r * 0.66, cy - r * 0.48); g.stroke();
      g.beginPath(); g.arc(cx + s * r * 0.66, cy - r * 0.58, r * 0.17, 0, Math.PI * 2); g.fill();
      g.fillStyle = COL.abyss; g.beginPath(); g.arc(cx + s * r * 0.66, cy - r * 0.58, r * 0.05, 0, Math.PI * 2); g.fill(); g.fillStyle = color;
    });
    g.lineWidth = r * 0.15;
    [-1, 1].forEach(s => {
      g.beginPath(); g.moveTo(cx + s * r * 0.22, cy + r * 0.12);
      g.bezierCurveTo(cx + s * r * 0.95, cy + r * 0.05, cx + s * r * 0.95, cy + r * 0.8, cx + s * r * 0.55, cy + r * 0.78);
      g.stroke();
    });
    g.lineWidth = r * 0.2;
    [-1, 1].forEach(s => { g.beginPath(); g.moveTo(cx + s * r * 0.12, cy + r * 0.15); g.lineTo(cx + s * r * 0.24, cy + r * 0.72); g.stroke(); });
    g.lineWidth = r * 0.08;
    [-1, 1].forEach(s => { g.beginPath(); g.arc(cx + s * r * 0.26, cy + r * 0.86, r * 0.12, -Math.PI * 0.2, Math.PI * 1.2); g.stroke(); });
    g.beginPath(); g.arc(cx, cy - r * 0.28, r * 0.46, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.roundRect(cx - r * 0.28, cy - r * 0.2, r * 0.56, r * 0.4, r * 0.1); g.fill();
    g.fillStyle = COL.abyss;
    [-1, 1].forEach(s => { g.beginPath(); g.arc(cx + s * r * 0.19, cy - r * 0.26, r * 0.14, 0, Math.PI * 2); g.fill(); });
    g.strokeStyle = color; g.lineWidth = r * 0.03;
    [-1, 1].forEach(s => { g.beginPath(); g.arc(cx + s * r * 0.19, cy - r * 0.26, r * 0.08, 0, Math.PI * 2); g.stroke(); });
    g.beginPath(); g.moveTo(cx - r * 0.06, cy - r * 0.04); g.lineTo(cx + r * 0.06, cy - r * 0.04); g.lineTo(cx, cy + r * 0.08); g.closePath(); g.fill();
    g.restore();
  }

  function orient(e, spin) {
    if (spin) ctx.rotate(spin);
    ctx.scale(e.hface === "left" ? -1 : 1, 1);
    ctx.rotate(e.face === "up" ? -0.5 : e.face === "down" ? 0.5 : 0);
  }
  function drawROV(cx, cy, e, t, scale, spin) {
    const u = T * scale;
    ctx.save(); ctx.translate(cx, cy); orient(e, spin);
    const grad = ctx.createLinearGradient(u * 0.4, 0, u * 1.3, 0);
    grad.addColorStop(0, COL.lamp); grad.addColorStop(1, "transparent");
    ctx.globalAlpha = 0.22; ctx.fillStyle = grad;
    ctx.beginPath(); ctx.moveTo(u * 0.4, -u * 0.04); ctx.lineTo(u * 1.3, -u * 0.38); ctx.lineTo(u * 1.3, u * 0.3); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = COL.frame; ctx.fillRect(-u * 0.4, -u * 0.04, u * 0.8, u * 0.28);
    ctx.strokeStyle = COL.rov; ctx.lineWidth = Math.max(1, u * 0.04);
    ctx.strokeRect(-u * 0.4, -u * 0.04, u * 0.8, u * 0.28);
    ctx.fillStyle = COL.rov;
    ctx.beginPath(); ctx.roundRect(-u * 0.43, -u * 0.32, u * 0.86, u * 0.3, u * 0.07); ctx.fill();
    ctx.fillStyle = COL.frame; ctx.strokeStyle = COL.edge;
    ctx.beginPath(); ctx.arc(-u * 0.43, u * 0.1, u * 0.09, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = COL.lamp; ctx.beginPath(); ctx.arc(u * 0.38, -u * 0.02, u * 0.065, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.abyss; ctx.beginPath(); ctx.arc(u * 0.3, u * 0.1, u * 0.05, 0, Math.PI * 2); ctx.fill();
    const moving = e.dir && mode === "play";
    const open = moving ? (Math.sin(t * 16) + 1) * 0.35 : 0.2;
    ctx.strokeStyle = COL.muted; ctx.lineWidth = Math.max(1.2, u * 0.06); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(u * 0.3, u * 0.22); ctx.lineTo(u * 0.5, u * 0.3); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(u * 0.5, u * 0.3); ctx.lineTo(u * 0.5 + Math.cos(-open) * u * 0.14, u * 0.3 + Math.sin(-open) * u * 0.14);
    ctx.moveTo(u * 0.5, u * 0.3); ctx.lineTo(u * 0.5 + Math.cos(open) * u * 0.14, u * 0.3 + Math.sin(open) * u * 0.14);
    ctx.stroke();
    ctx.restore();
  }
  function drawDiver(cx, cy, e, t, scale, spin) {
    const u = T * scale * 1.2;
    const moving = e.dir && mode === "play";
    const kick = moving && !reduceMotion ? Math.sin(t * 12) * 0.35 : 0.1;
    ctx.save(); ctx.translate(cx, cy); orient(e, spin);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = COL.frame; ctx.lineWidth = u * 0.1;
    ctx.beginPath(); ctx.moveTo(-u * 0.14, u * 0.04); ctx.lineTo(-u * 0.38, u * 0.02 + kick * u * 0.12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-u * 0.14, u * 0.08); ctx.lineTo(-u * 0.38, u * 0.1 - kick * u * 0.12); ctx.stroke();
    ctx.fillStyle = COL.j4;
    [0.02 + kick * 0.12, 0.1 - kick * 0.12].forEach(fy => {
      ctx.beginPath(); ctx.moveTo(-u * 0.36, u * fy); ctx.lineTo(-u * 0.52, u * (fy - 0.08)); ctx.lineTo(-u * 0.52, u * (fy + 0.08)); ctx.closePath(); ctx.fill();
    });
    ctx.beginPath(); ctx.ellipse(-u * 0.02, u * 0.05, u * 0.2, u * 0.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.frame; ctx.fillRect(-u * 0.1, -u * 0.06, u * 0.14, u * 0.06);
    ctx.strokeStyle = COL.j4; ctx.lineWidth = u * 0.08;
    ctx.beginPath(); ctx.moveTo(u * 0.08, u * 0.08); ctx.lineTo(u * 0.3, u * 0.16); ctx.stroke();
    ctx.fillStyle = COL.rov;
    ctx.beginPath(); ctx.arc(u * 0.25, -u * 0.04, u * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.abyss;
    ctx.beginPath(); ctx.ellipse(u * 0.33, -u * 0.04, u * 0.08, u * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.lamp;
    ctx.beginPath(); ctx.arc(u * 0.24, -u * 0.2, u * 0.04, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function drawAUV(cx, cy, e, t, scale, spin) {
    const u = T * scale;
    const moving = e.dir && mode === "play";
    ctx.save(); ctx.translate(cx, cy); orient(e, spin);
    if (moving && !reduceMotion) {
      const r = (t * 1.5) % 1;
      ctx.strokeStyle = COL.sonar; ctx.globalAlpha = 0.5 * (1 - r); ctx.lineWidth = Math.max(1, u * 0.04);
      ctx.beginPath(); ctx.arc(u * 0.45, 0, u * (0.1 + r * 0.5), -0.7, 0.7); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.fillStyle = COL.j4;
    ctx.beginPath(); ctx.moveTo(-u * 0.3, 0); ctx.lineTo(-u * 0.44, -u * 0.18); ctx.lineTo(-u * 0.38, 0); ctx.lineTo(-u * 0.44, u * 0.18); ctx.closePath(); ctx.fill();
    ctx.fillStyle = COL.text;
    ctx.beginPath(); ctx.ellipse(0, 0, u * 0.4, u * 0.13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.j4;
    ctx.beginPath(); ctx.ellipse(u * 0.3, 0, u * 0.11, u * 0.11, 0, -Math.PI / 2, Math.PI / 2); ctx.fill();
    ctx.fillStyle = COL.frame; ctx.fillRect(-u * 0.12, -u * 0.13, u * 0.05, u * 0.26);
    ctx.fillStyle = COL.coral; ctx.fillRect(u * 0.02, -u * 0.18, u * 0.08, u * 0.06);
    const sp = moving && !reduceMotion ? Math.abs(Math.sin(t * 30)) : 0.6;
    ctx.fillStyle = COL.muted; ctx.fillRect(-u * 0.48, -u * 0.12 * sp, u * 0.04, u * 0.24 * sp);
    ctx.restore();
  }
  function drawPlayer(cx, cy, e, t, scale, spin) {
    if (vehicle === "diver") drawDiver(cx, cy, e, t, scale, spin);
    else if (vehicle === "auv") drawAUV(cx, cy, e, t, scale, spin);
    else drawROV(cx, cy, e, t, scale, spin);
  }

  function drawJelly(j, cx, cy, t) {
    const u = T;
    const dir = DIRS[j.dir || "down"];
    cy += reduceMotion ? 0 : Math.sin(t * 4 + j.i) * u * 0.04;
    const color = JELLY[j.i % JELLY.length];
    ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.2, u * 0.07); ctx.lineCap = "round";
    for (let i = 0; i < 4; i++) {
      const x0 = cx + (i - 1.5) * u * 0.16;
      ctx.beginPath(); ctx.moveTo(x0, cy + u * 0.05);
      for (let k = 1; k <= 4; k++) ctx.lineTo(x0 + Math.sin(t * 7 + i + k) * u * 0.05, cy + u * 0.05 + k * u * 0.09);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(cx, cy + u * 0.05, u * 0.36, Math.PI, 0);
    ctx.quadraticCurveTo(cx + u * 0.18, cy + u * 0.14, cx, cy + u * 0.06);
    ctx.quadraticCurveTo(cx - u * 0.18, cy + u * 0.14, cx - u * 0.36, cy + u * 0.05);
    ctx.fill();
    ctx.fillStyle = COL.text;
    ctx.beginPath(); ctx.arc(cx - u * 0.12, cy - u * 0.08, u * 0.08, 0, Math.PI * 2); ctx.arc(cx + u * 0.12, cy - u * 0.08, u * 0.08, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.abyss;
    ctx.beginPath();
    ctx.arc(cx - u * 0.12 + dir[0] * u * 0.035, cy - u * 0.08 + dir[1] * u * 0.035, u * 0.04, 0, Math.PI * 2);
    ctx.arc(cx + u * 0.12 + dir[0] * u * 0.035, cy - u * 0.08 + dir[1] * u * 0.035, u * 0.04, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBonus(kind, cx, cy, t) {
    const u = T;
    ctx.save();
    ctx.shadowColor = COL.lamp; ctx.shadowBlur = u * 0.35;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (kind === 0) {
      ctx.fillStyle = COL.text;
      ctx.beginPath(); ctx.arc(cx, cy + u * 0.1, u * 0.3, Math.PI, 0); ctx.fill();
      ctx.fillRect(cx - u * 0.42, cy + u * 0.08, u * 0.84, u * 0.1);
      ctx.fillStyle = COL.coral; ctx.fillRect(cx - u * 0.04, cy - u * 0.2, u * 0.08, u * 0.28);
    } else if (kind === 1) {
      ctx.strokeStyle = COL.text; ctx.lineWidth = u * 0.07;
      ctx.beginPath(); ctx.moveTo(cx - u * 0.14, cy - u * 0.08); ctx.lineTo(cx - u * 0.14, cy - u * 0.2); ctx.lineTo(cx + u * 0.14, cy - u * 0.2); ctx.lineTo(cx + u * 0.14, cy - u * 0.08); ctx.stroke();
      ctx.fillStyle = JELLY[0]; ctx.fillRect(cx - u * 0.36, cy - u * 0.1, u * 0.72, u * 0.36);
      ctx.fillStyle = COL.frame; ctx.fillRect(cx - u * 0.36, cy + u * 0.04, u * 0.72, u * 0.05);
    } else if (kind === 2) {
      ctx.fillStyle = COL.muted; ctx.fillRect(cx - u * 0.08, cy - u * 0.1, u * 0.16, u * 0.44);
      ctx.fillStyle = COL.j4; ctx.fillRect(cx - u * 0.3, cy - u * 0.24, u * 0.6, u * 0.14);
      ctx.fillStyle = COL.text; ctx.fillRect(cx - u * 0.05, cy + u * 0.3, u * 0.1, u * 0.08);
    } else if (kind === 3) {
      ctx.strokeStyle = JELLY[0]; ctx.lineWidth = u * 0.08;
      ctx.beginPath(); ctx.arc(cx, cy, u * 0.3, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = u * 0.06;
      for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3 + t; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * u * 0.3, cy + Math.sin(a) * u * 0.3); ctx.lineTo(cx - Math.cos(a) * u * 0.3, cy - Math.sin(a) * u * 0.3); ctx.stroke(); }
      ctx.fillStyle = COL.text; ctx.beginPath(); ctx.arc(cx, cy, u * 0.08, 0, Math.PI * 2); ctx.fill();
    } else if (kind === 4) {
      ctx.fillStyle = COL.j4; ctx.fillRect(cx - u * 0.12, cy - u * 0.2, u * 0.24, u * 0.5);
      ctx.fillStyle = COL.frame; ctx.fillRect(cx - u * 0.12, cy + u * 0.02, u * 0.24, u * 0.06);
      ctx.fillStyle = Math.floor(t * 3) % 2 ? COL.sonar : COL.text;
      ctx.beginPath(); ctx.arc(cx, cy - u * 0.28, u * 0.1, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = COL.rov; ctx.lineWidth = u * 0.12;
      ctx.beginPath(); ctx.moveTo(cx - u * 0.25, cy + u * 0.25); ctx.lineTo(cx + u * 0.12, cy - u * 0.12); ctx.stroke();
      ctx.lineWidth = u * 0.1;
      ctx.beginPath(); ctx.arc(cx + u * 0.2, cy - u * 0.2, u * 0.14, Math.PI * 0.9, Math.PI * 2.35); ctx.stroke();
    }
    ctx.restore();
  }
  function drawWinch(cx, cy, t) {
    const u = T;
    ctx.save();
    ctx.shadowColor = COL.sonar; ctx.shadowBlur = u * 0.35;
    ctx.strokeStyle = COL.sonar; ctx.lineWidth = u * 0.07;
    ctx.beginPath(); ctx.arc(cx, cy, u * 0.32, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = COL.rov; ctx.beginPath(); ctx.arc(cx, cy, u * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = COL.frame; ctx.lineWidth = u * 0.04;
    const a = reduceMotion ? 0 : -t * 3;
    for (let k = 0; k < 3; k++) { const b = a + k * Math.PI * 2 / 3; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(b) * u * 0.2, cy + Math.sin(b) * u * 0.2); ctx.stroke(); }
    ctx.restore();
  }

  // The umbilical: a fat yellow cable through the path the vehicle has flown, with marker bands.
  function drawTether(hx, hy, k, flash) {
    const n = segs.length;
    const pts = [[hx, hy]];
    for (let i = 1; i < n; i++) pts.push([segs[i].x, segs[i].y]);
    const pt = prev[n - 1] || segs[n - 1];
    pts.push([lerp(pt.x, segs[n - 1].x, k), lerp(pt.y, segs[n - 1].y, k)]);
    const path = () => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo((x + 0.5) * T, (y + 0.5) * T) : ctx.moveTo((x + 0.5) * T, (y + 0.5) * T)); };
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (flash) ctx.globalAlpha = 0.35;
    path(); ctx.strokeStyle = COL.abyss; ctx.lineWidth = T * 0.4; ctx.stroke();
    path(); ctx.strokeStyle = COL.rov; ctx.lineWidth = T * 0.26; ctx.stroke();
    ctx.setLineDash([T * 0.1, T * 0.9]); ctx.lineCap = "butt";
    path(); ctx.strokeStyle = COL.frame; ctx.lineWidth = T * 0.26; ctx.stroke();
    ctx.setLineDash([]);
    const [ex, ey] = pts[pts.length - 1];
    ctx.fillStyle = COL.j4;
    ctx.beginPath(); ctx.arc((ex + 0.5) * T, (ey + 0.5) * T, T * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function centreText(text, y, color, size) {
    ctx.font = `700 ${size}px ${FONT}`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = COL.abyss; ctx.fillText(text, W / 2 + 2, y + 2);
    ctx.fillStyle = color; ctx.fillText(text, W / 2, y);
  }

  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, COL.deep); bg.addColorStop(1, COL.abyss);
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 5; i++) {
      const sway = reduceMotion ? 0 : Math.sin(t * 0.25 + i * 1.7) * T * 0.8;
      const x0 = W * (0.08 + i * 0.21) + sway;
      const g = ctx.createLinearGradient(0, 0, 0, H * 0.85);
      g.addColorStop(0, COL.text); g.addColorStop(1, "transparent");
      ctx.globalAlpha = 0.05 + (i % 2) * 0.03;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(x0 - T * 0.5, 0); ctx.lineTo(x0 + T * 0.5, 0); ctx.lineTo(x0 + T * 2.6, H * 0.85); ctx.lineTo(x0 + T * 0.4, H * 0.85); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = COL.muted;
    for (const s of snow) { ctx.globalAlpha = s.a; ctx.fillRect(s.x, s.y, s.r, s.r); }
    ctx.globalAlpha = 1;

    if (mode === "clear") ctx.globalAlpha = Math.floor(modeT * 6) % 2 ? 0.35 : 1;
    ctx.drawImage(wallLayer, 0, 0, W, H);
    ctx.globalAlpha = 1;

    // kit counter in the bottom border
    ctx.font = `600 ${Math.max(8, T * 0.42)}px ${FONT}`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = COL.muted;
    ctx.fillText(`KIT ${got} / ${GOAL}  ·  ${site().name.toUpperCase()}`, W / 2, (ROWS - 0.5) * T);

    if (octo) {
      const pulse = reduceMotion ? 0 : (Math.sin(t * 5) + 1) / 2;
      ctx.save(); ctx.shadowColor = COL.coral; ctx.shadowBlur = T * (0.2 + pulse * 0.5);
      drawOcto(ctx, (octo.x + 0.5) * T, (octo.y + 0.5) * T, T * 0.4, COL.coral);
      ctx.restore();
    }
    const bob = reduceMotion ? 0 : Math.sin(t * 3) * T * 0.05;
    if (bonus && !(bonus.t < 2 && Math.floor(t * 8) % 2)) drawBonus(bonus.kind, (bonus.x + 0.5) * T, (bonus.y + 0.5) * T + bob, t);
    if (winch && !(winch.t < 2 && Math.floor(t * 8) % 2)) drawWinch((winch.x + 0.5) * T, (winch.y + 0.5) * T + bob, t);

    for (const b of bubbles) {
      ctx.globalAlpha = 1 - b.age / 0.9; ctx.strokeStyle = COL.edge; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    let [hx, hy, k] = headPos();
    if (graceT > 0 && !reduceMotion) hx += Math.sin(t * 60) * 0.06;
    const dying = mode === "dying";
    drawTether(hx, hy, k, dying && Math.floor(modeT * 8) % 2);

    for (const j of jellies) { const [jx, jy] = jellyPos(j); drawJelly(j, (jx + 0.5) * T, (jy + 0.5) * T, t); }

    if (dying) {
      const d = Math.min(1, modeT / 1.2);
      if (d < 1) drawPlayer((hx + 0.5) * T, (hy + 0.5) * T, player, t, 1 - d * 0.9, reduceMotion ? 0 : d * 12);
    } else {
      if (player.shield) {
        ctx.strokeStyle = COL.sonar; ctx.lineWidth = Math.max(1, T * 0.05);
        ctx.globalAlpha = 0.35 + (reduceMotion ? 0 : Math.sin(t * 4) * 0.15);
        ctx.beginPath(); ctx.arc((hx + 0.5) * T, (hy + 0.5) * T, T * 0.62, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      drawPlayer((hx + 0.5) * T, (hy + 0.5) * T, player, t, 1.05, 0);
    }

    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.age / 1.2);
      ctx.font = `700 ${Math.max(10, T * 0.5)}px ${FONT}`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = COL.sonar;
      ctx.fillText(p.text, p.x, p.y - p.age * T);
    }
    ctx.globalAlpha = 1;

    if (mode === "play" && !dir) {
      centreText(`DEPTH ${level * 250} M`, 9.5 * T, COL.rov, Math.max(11, T * 0.62));
      centreText(site().name.toUpperCase(), 11 * T, COL.sonar, Math.max(9, T * 0.45));
      if (Math.floor(t * 2) % 2 || reduceMotion) centreText("STEER TO START", 12.6 * T, COL.text, Math.max(9, T * 0.42));
    }
    if (mode === "clear") centreText("SITE CLEAR", 11.5 * T, COL.rov, Math.max(11, T * 0.62));
  }

  /* ---------- HUD ---------- */
  const hud = { score: $("score"), best: $("best"), depth: $("depth"), tether: $("tether"), lives: $("lives") };
  let lastHud = "";
  function updateHud() {
    const shown = Math.max(0, lives);
    const key = `${score}|${best}|${level}|${shown}|${segs.length}`;
    if (key === lastHud) return;
    lastHud = key;
    hud.score.textContent = score.toLocaleString("en-GB");
    hud.best.textContent = Math.max(best, score).toLocaleString("en-GB");
    hud.depth.textContent = `${level * 250} m`;
    hud.tether.textContent = `${segs.length * 5} m`;
    hud.lives.innerHTML = "";
    for (let i = 0; i < shown; i++) { const s = document.createElement("span"); s.className = "life"; hud.lives.appendChild(s); }
  }

  /* ---------- screens ---------- */
  function showOverlay(kind) {
    overlay.hidden = false;
    if (kind === "title") {
      panel.innerHTML = `
        <img class="banner" src="${BANNER}" alt="AS-Recruitment.com. Experts in delivering excellence.">
        <h1>Tether Tangle</h1>
        <p>Collect ASR octopuses. Each one pays out more umbilical. Hit a structure or your own tether and it's a tangle.</p>
        <p class="small">12 clears a site. Grab the winch to reel in.</p>
        ${pickerHTML()}
        <button class="big" id="goBtn" type="button">Launch</button>`;
    } else if (kind === "over") {
      panel.innerHTML = `
        <span class="eyebrow${newBest ? " newbest" : ""}">${newBest ? "New best score" : "Dive over"}</span>
        <h1>Back on deck</h1>
        <div class="result">
          <div class="stat"><span class="label">Score</span><span class="val">${score.toLocaleString("en-GB")}</span></div>
          <div class="stat"><span class="label">Best</span><span class="val gold">${best.toLocaleString("en-GB")}</span></div>
          <div class="stat"><span class="label">Depth</span><span class="val">${level * 250} m</span></div>
        </div>
        <button class="big" id="goBtn" type="button">Launch again</button>
        <div class="actions"><button class="btn-sm" id="shareBtn" type="button">Share score</button></div>
        <a class="cta" href="https://as-recruitment.com" target="_blank" rel="noopener">Fancy the real job? See our roles</a>
        ${pickerHTML()}`;
    } else if (kind === "paused") {
      panel.innerHTML = `
        <span class="eyebrow">All stop</span>
        <h1>Paused</h1>
        <button class="big" id="goBtn" type="button">Resume</button>`;
    }
    $("goBtn").addEventListener("click", () => { kind === "paused" ? togglePause() : startGame(); });
    if (kind === "over") $("shareBtn").addEventListener("click", shareScore);
    wirePicker();
    $("goBtn").focus({ preventScroll: true });
  }
  function pickerHTML() {
    return `<div class="picker" role="radiogroup" aria-label="Choose your vehicle">${
      Object.entries(VEHICLES).map(([k, v]) => `
        <button class="pick" type="button" role="radio" aria-checked="${k === vehicle}" data-v="${k}">
          <canvas data-pv="${k}"></canvas>
          <span class="pname">${v.name}</span>
          <span class="pperk">${v.perk}</span>
        </button>`).join("")
    }</div>`;
  }
  function wirePicker() {
    panel.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => {
      vehicle = b.dataset.v;
      try { localStorage.setItem("asr-tether-vehicle", vehicle); } catch (e) {}
      panel.querySelectorAll(".pick").forEach(x => x.setAttribute("aria-checked", String(x === b)));
      initAudio();
      const l = pick(OWN[vehicle]); say(l[0], l[1], true);
    }));
    panel.querySelectorAll("canvas[data-pv]").forEach(c => {
      const pr = Math.min(window.devicePixelRatio || 1, 2);
      c.width = 64 * pr; c.height = 44 * pr;
      const g = c.getContext("2d");
      const savedCtx = ctx, savedT = T, savedV = vehicle;
      ctx = g; T = 40; vehicle = c.dataset.pv;
      g.setTransform(pr, 0, 0, pr, 0, 0);
      drawPlayer(34, 24, { hface: "right", face: "right", dir: null }, 0, 1, 0);
      ctx = savedCtx; T = savedT; vehicle = savedV;
    });
  }

  function startGame() {
    initAudio();
    score = 0; lives = 3; level = 1; extraGiven = false; popups = []; octo = null;
    buildSite(); launch(); buildWalls();
    mode = "play"; modeT = 0;
    overlay.hidden = true;
    sfxStart(); sayEvent("start");
  }
  async function shareScore() {
    const btn = $("shareBtn");
    const text = `I reached ${level * 250} m and scored ${score.toLocaleString("en-GB")} on Tether Tangle without a single knot. Well, nearly. Can you beat it?`;
    const url = location.href.split("#")[0];
    try {
      if (navigator.share) { await navigator.share({ title: "Tether Tangle", text, url }); return; }
      await navigator.clipboard.writeText(`${text} ${url}`);
      btn.textContent = "Copied";
    } catch (e) {
      if (e && e.name === "AbortError") return;
      btn.textContent = "Couldn't share";
    }
    setTimeout(() => { if (btn.isConnected) btn.textContent = "Share score"; }, 2000);
  }
  function gameOver() {
    mode = "over";
    newBest = score > best && score > 0;
    if (score > best) { best = score; try { localStorage.setItem("asr-tether-best", String(best)); } catch (e) {} }
    showOverlay("over");
  }
  function togglePause() {
    if (mode === "paused") { mode = pausedFrom; pausedFrom = null; overlay.hidden = true; $("pauseBtn").textContent = "Pause"; }
    else if (mode === "play") { pausedFrom = mode; mode = "paused"; showOverlay("paused"); $("pauseBtn").textContent = "Resume"; }
  }

  /* ---------- input ---------- */
  function setNext(d) {
    if (mode !== "play") return;
    if (!dir) {
      // first move: anything except straight back into the tether
      const nx = segs[0].x + DIRS[d][0], ny = segs[0].y + DIRS[d][1];
      if (segs[1] && segs[1].x === nx && segs[1].y === ny) return;
      dir = d; acc = interval(); queue = [];
      return;
    }
    const last = queue.length ? queue[queue.length - 1] : dir;
    if (d === last || d === OPP[last]) return;
    if (queue.length < 2) queue.push(d);
  }
  const KEYS = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right", w:"up", s:"down", a:"left", d:"right", W:"up", S:"down", A:"left", D:"right" };
  window.addEventListener("keydown", ev => {
    if (KEYS[ev.key]) { ev.preventDefault(); setNext(KEYS[ev.key]); return; }
    if (ev.key === "p" || ev.key === "P" || ev.key === "Escape") { togglePause(); return; }
    if ((ev.key === "Enter" || ev.key === " ") && (mode === "title" || mode === "over") && document.activeElement?.id !== "goBtn") { ev.preventDefault(); startGame(); }
  });
  let sw = null;
  stage.addEventListener("pointerdown", ev => { sw = { x: ev.clientX, y: ev.clientY }; });
  stage.addEventListener("pointermove", ev => {
    if (!sw) return;
    const dx = ev.clientX - sw.x, dy = ev.clientY - sw.y;
    if (Math.hypot(dx, dy) < 18) return;
    setNext(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    sw = { x: ev.clientX, y: ev.clientY };
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(n => stage.addEventListener(n, () => { sw = null; }));
  document.querySelectorAll("#pad button").forEach(b => b.addEventListener("pointerdown", ev => { ev.preventDefault(); setNext(b.dataset.dir); }));
  $("pauseBtn").addEventListener("click", togglePause);
  $("muteBtn").addEventListener("click", () => { muted = !muted; $("muteBtn").textContent = muted ? "Sound off" : "Sound on"; initAudio(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && mode === "play") togglePause(); });

  /* ---------- sound ---------- */
  function initAudio() {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
    if (audio && audio.state === "suspended") audio.resume().catch(() => {});
  }
  function tone(f, d, type = "square", vol = 0.04, slide = 0, delay = 0) {
    if (!audio || muted) return;
    const t0 = audio.currentTime + delay;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t0 + d);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0 + d + 0.02);
  }
  const blip = () => { tone(520, 0.06, "square", 0.03); tone(780, 0.08, "square", 0.03, 0, 0.05); };
  const sfxBump = () => tone(140, 0.25, "square", 0.05, -60);
  const sfxWinch = () => tone(900, 0.4, "sawtooth", 0.03, -700);
  const sfxDeath = () => tone(620, 1.1, "triangle", 0.06, -540);
  const sfxClear = () => {
    [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, "square", 0.035, 0, i * 0.12));
    tone(110, 0.9, "sawtooth", 0.05, 0, 0.6); tone(147, 0.9, "sawtooth", 0.04, 0, 0.6); // ship's horn
  };
  function crackle() {
    if (!audio || muted) return;
    try {
      const len = Math.floor(audio.sampleRate * 0.09);
      const buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = audio.createBufferSource(), g = audio.createGain(), f = audio.createBiquadFilter();
      f.type = "bandpass"; f.frequency.value = 1800; g.gain.value = 0.05;
      src.buffer = buf; src.connect(f); f.connect(g); g.connect(audio.destination); src.start();
    } catch (e) {}
  }
  const sfxBonus = () => [660, 880, 1320].forEach((f, i) => tone(f, 0.1, "triangle", 0.05, 0, i * 0.07));
  const sfxExtra = () => [523, 784, 523, 1046].forEach((f, i) => tone(f, 0.14, "square", 0.04, 0, i * 0.11));
  const sfxStart = () => [392, 523, 659].forEach((f, i) => tone(f, 0.14, "square", 0.03, 0, i * 0.1));

  /* ---------- sizing ---------- */
  function resize() {
    const r = stage.getBoundingClientRect();
    T = Math.max(10, Math.floor(Math.min(r.width / COLS, r.height / ROWS)));
    W = COLS * T; H = ROWS * T;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    screenEl.style.width = W + "px"; screenEl.style.height = H + "px";
    buildWalls();
    snow = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() < 0.3 ? 2 : 1, v: 4 + Math.random() * 10, a: 0.2 + Math.random() * 0.4, ph: Math.random() * 6 }));
  }
  window.addEventListener("resize", resize);

  /* ---------- boot ---------- */
  buildSite(); launch();
  resize();
  showOverlay("title");
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (mode !== "paused") update(dt);
    draw(now / 1000);
    updateHud();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
